{% extends 'base.html' %}

{% block content %}

<script>
    function readurl1(input){
        if (input.files && input.files[0]) {
            document.getElementById('preview1').src = URL.createObjectURL(input.files[0]);
        }
    }
    function readurl2(input){
        if (input.files && input.files[0]) {
            document.getElementById('preview2').src = URL.createObjectURL(input.files[0]);
        }
    }
</script>


<div class="container-fluid" style="margin-top: 20px;">

    {% if error %}
    <p class="error">{{error}}</p>
    {% endif %}

    <center>
    <div class="card shadow" style="max-width: 1200px;border:6px;border-radius: 25px;padding: 20px;">
        <h1 style="padding-bottom: 20px;">Admin Post!</h1>
        <form action="{{ url_for('admin.admin_listing') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-0">
            <div class="col">
                <h3>Enter Thought of the Day</h3>
                <div class="form-group">
                    <label for="iname1">Title:</label>  <br>
                    <input type="text" class="form-control"  id="iname1" name="iname1" placeholder="Enter Item Name.." required>
                </div>
                <div class="form-group">
                    <label for="link1">Link:</label>  <br>
                    <input type="text" class="form-control"  id="link1" name="link1" placeholder="Enter Link..">
                </div>
                <div class="form-group">
                    <label for="img1">Upload Image</label> <br>
                    <input type="file" id="img1" name='img1' accept="image/*" onchange="readurl1(this)" required>
                </div>
                <img  width="500" height="500" class="card-img" id="preview1" src="/static/img/default-img.jpg" alt="Thought of the day">
            </div>
            <div class="col" style="padding-left: 20px;">
                <h3>Enter Advertisement</h3>
                <div class="form-group">
                    <label for="iname2">Title:</label>  <br>
                    <input type="text" class="form-control"  id="iname2" name="iname2" placeholder="Enter Item Name.." required>
                </div>
                <div class="form-group">
                    <label for="link2">Link:</label>  <br>
                    <input type="text" class="form-control"  id="link2" name="link2" placeholder="Enter Link..">
                </div>
                <div class="form-group">
                    <label for="img2">Upload Image</label> <br>
                    <input type="file" id="img2" name='img2' accept="image/*" onchange="readurl2(this)" required>
                </div>
                <img  width="500" height="500" class="card-img" id="preview2" src="/static/img/default-img.jpg" alt="Advertisement">
            </div>
        </div>
        <br>
        <input style="padding-top: 20px;" type="submit" class="btn btn-primary" value="Submit your promotions!">
        </form>
    </div>
    </center>
</div>

{% endblock %}
