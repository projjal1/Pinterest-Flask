{% extends 'base.html' %}

{% block title %}Admin Post — Pinterest{% endblock %}

{% block content %}

<div class="container-fluid mt-4">
  {% include '_alerts.html' %}

  <div class="card shadow rounded-4 p-4 mx-auto" style="max-width: 1200px;">
    <h1 class="text-center pb-3">Admin Post!</h1>

    <form action="{{ url_for('admin.admin_listing') }}" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="row g-4">
        <div class="col-md-6">
          <h3>Enter Thought of the Day</h3>
          <div class="mb-3">
            <label class="form-label" for="iname1">Title</label>
            <input type="text" class="form-control" id="iname1" name="iname1" placeholder="Enter a title.." required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="link1">Link</label>
            <input type="text" class="form-control" id="link1" name="link1" placeholder="Enter a link..">
          </div>
          <div class="mb-3">
            <label class="form-label" for="img1">Upload Image</label>
            <input type="file" class="form-control" id="img1" name="img1" accept="image/*" data-preview="preview1" required>
          </div>
          <img class="img-fluid card-img" id="preview1" src="{{ url_for('static', filename='img/default-img.jpg') }}" alt="Thought of the day preview">
        </div>

        <div class="col-md-6">
          <h3>Enter Advertisement</h3>
          <div class="mb-3">
            <label class="form-label" for="iname2">Title</label>
            <input type="text" class="form-control" id="iname2" name="iname2" placeholder="Enter a title.." required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="link2">Link</label>
            <input type="text" class="form-control" id="link2" name="link2" placeholder="Enter a link..">
          </div>
          <div class="mb-3">
            <label class="form-label" for="img2">Upload Image</label>
            <input type="file" class="form-control" id="img2" name="img2" accept="image/*" data-preview="preview2" required>
          </div>
          <img class="img-fluid card-img" id="preview2" src="{{ url_for('static', filename='img/default-img.jpg') }}" alt="Advertisement preview">
        </div>
      </div>

      <div class="text-center pt-4">
        <button type="submit" class="btn btn-primary">Submit your promotions!</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
