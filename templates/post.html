{% extends 'base.html' %}

{% block title %}Create a Pin — Pinterest{% endblock %}

{% block content %}

<div class="container-fluid">
  <div class="jumbotron">
    <div class="container-fluid">
      <h1 class="display-3">List Image</h1>
      <p>Enter details for the image to be listed on our portal.<br>
        Associated information helps the website render pins by category.</p>
    </div>
  </div>

  {% include '_alerts.html' %}

  <div class="card shadow rounded-4 p-4 mx-auto mt-4" style="max-width: 1100px;">
    <div class="row g-4">
      <div class="col-md-6 text-center">
        <img class="img-fluid rounded" src="{{ url_for('static', filename='img/default-img.jpg') }}" id="preview" alt="Pin preview">
      </div>
      <div class="col-md-6">
        <form action="{{ url_for('main.post') }}" method="POST" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label" for="itemname">Title</label>
            <input type="text" class="form-control" id="itemname" name="iname" placeholder="Enter a title.." required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea rows="6" class="form-control" id="description" name="desc" placeholder="Enter a description.."></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label" for="links">Link</label>
            <textarea rows="3" class="form-control" id="links" name="links" placeholder="Enter a link.."></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label" for="image">Upload Image</label>
            <input type="file" class="form-control" id="image" name="img" accept="image/*" data-preview="preview" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="category">Category</label>
            <select class="form-select" name="cat" id="category">
              {% for cat in categories %}
              <option value="{{ cat.name }}">{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>

          <button class="btn btn-primary" type="submit">List Item</button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
