{% extends 'base.html' %}

{% block title %}Sign In — Pinterest{% endblock %}

{% block content %}

<div class="container-fluid">
  <div class="jumbotron">
    <div class="container-fluid">
      <h1 class="display-3">Sign In</h1>
      <p>Already have an account? Then log in and explore pins to your taste.</p>
    </div>
  </div>

  {% include '_alerts.html' %}

  <main class="mx-auto" style="max-width: 480px;">
    <form action="{{ url_for('auth.login') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Pinterest" height="100">
        <h1 class="h3 fw-normal mt-3">Please sign in</h1>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email-add">Email</label>
        <input type="email" class="form-control" id="email-add" name="email" placeholder="Email" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="pwd" required>
      </div>

      <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
    </form>
  </main>
</div>

{% endblock %}
